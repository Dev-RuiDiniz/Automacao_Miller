<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo upload | Agente Regulatório</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/upload"><span class="brand-mark">DB</span><span>Agente Regulatório</span></a><nav class="nav"><a href="/upload">Fila</a><a href="/settings/recipients">Destinatários</a><button data-logout>Sair</button></nav></header><main class="page" style="max-width:760px"><div class="heading"><div><div class="eyebrow">Entrada oficial</div><h1>Novo documento</h1><p class="lede">Envie um PDF para iniciar o processamento interno e receber um protocolo.</p></div></div><section class="panel"><div class="panel-body"><div id="dropzone" class="dropzone" tabindex="0" role="button"><strong>Arraste o PDF para cá</strong><span>ou clique para selecionar um arquivo de até 100 MB</span><input id="file" type="file" accept="application/pdf,.pdf" class="hidden"></div><p id="filename" class="muted"></p><div class="actions"><button id="send" class="button" disabled>Enviar documento</button><a class="button secondary" href="/upload">Voltar para a fila</a></div><div id="message" class="notice hidden" role="status" style="margin-top:18px"></div><div id="status" class="notice info hidden" style="margin-top:12px"></div></div></section></main></div><script src="/static/app.js"></script><script>
const maxBytes=100*1024*1024,dz=document.querySelector('#dropzone'),fi=document.querySelector('#file'),send=document.querySelector('#send'),filename=document.querySelector('#filename'),message=document.querySelector('#message'),statusBox=document.querySelector('#status');let selected=null,protocol=null;function show(el,text,kind='info'){el.className='notice '+kind;el.textContent=text}function choose(file){if(!file||!file.name.toLowerCase().endsWith('.pdf'))return show(message,'Selecione um arquivo PDF.','error');if(file.size>maxBytes)return show(message,'O arquivo excede o limite de 100 MB.','error');selected=file;filename.textContent=`${file.name} · ${formatBytes(file.size)}`;send.disabled=false;message.className='notice hidden'}
dz.onclick=()=>fi.click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')fi.click()};fi.onchange=()=>choose(fi.files[0]);['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('active')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('active')}));dz.ondrop=e=>choose(e.dataTransfer.files[0]);send.onclick=async()=>{send.disabled=true;show(message,'Enviando e registrando o documento...');const body=new FormData();body.append('file',selected);try{const data=await api('/api/v1/submissions',{method:'POST',body});protocol=data.submission_id;show(message,`Protocolo ${protocol} registrado.`,'success');poll()}catch(e){show(message,e.message,'error');send.disabled=false}};async function poll(){try{const data=await api('/api/v1/submissions/'+protocol);show(statusBox,`Status: ${statusLabel(data.status)}${data.message?' · '+data.message:''}`);if(['concluido','erro','aguardando_revisao','aguardando_envio'].includes(data.status))return;setTimeout(poll,4000)}catch(_){setTimeout(poll,5000)}}
</script></body></html>
